<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FComp - 文件比对工具</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- jsdiff CDN (cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/8.0.2/diff.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Toast 通知容器 -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">FComp</h1>
        <span class="logo-subtitle">文件比对工具</span>
        <button type="button" class="btn-primary btn-compare" id="compare-btn" aria-label="开始比对">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          开始比对
        </button>
      </div>
      <div class="header-right">
        <label class="switch">
          <input type="checkbox" class="switch-input" id="sync-scroll-toggle" checked>
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
          <span class="switch-label">同步滚动</span>
        </label>
        <button type="button" class="btn-icon-only" id="theme-toggle" aria-label="切换主题" title="切换明暗主题">
          <svg class="btn-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="btn-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button type="button" class="btn-secondary btn-clear" id="clear-left" aria-label="清空左侧">清空左侧</button>
        <button type="button" class="btn-secondary btn-clear" id="clear-right" aria-label="清空右侧">清空右侧</button>
        <button type="button" class="btn-secondary btn-clear-all" id="clear-all" aria-label="清空全部">清空全部</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Mobile Warning -->
      <div class="mobile-warning" id="mobile-warning">
        <svg class="mobile-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12" y2="18"></line>
        </svg>
        <h2 class="mobile-warning-title">请使用 PC 端访问</h2>
        <p class="mobile-warning-text">FComp 文件比对工具专为桌面端设计，建议在电脑浏览器中打开以获得最佳体验。</p>
      </div>

      <!-- Panels Container -->
      <div class="panels-container">
        <!-- Source Panel (Left) -->
        <section class="panel" id="source-panel" aria-label="原始文件面板">
          <header class="panel-header">
            <h2 class="panel-title">
              <svg class="panel-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              原始文件
            </h2>
            <span class="file-name" id="source-file-name">
              <span class="file-name-placeholder">未选择文件</span>
            </span>
          </header>
          <div class="drop-zone" id="source-drop-zone" aria-label="源文件拖放区域">
            <input type="file" class="file-input-hidden" id="source-file-input" accept=".txt,.js,.jsx,.ts,.tsx,.json,.html,.htm,.css,.scss,.sass,.less,.md,.markdown,.xml,.yaml,.yml,.sql,.sh,.bash,.log,.conf,.ini,.properties">
            <div class="drop-zone-content">
              <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <div class="drop-zone-text">
                <span class="drop-zone-title">拖放文件到此处</span>
                <span class="drop-zone-subtitle">或点击选择文件 · 支持粘贴文本</span>
              </div>
              <button type="button" class="clear-file-btn" id="source-clear-btn">清除文件</button>
            </div>
            <div class="file-preview" id="source-file-preview">
              <div class="editor-container">
                <div class="line-numbers" id="source-line-numbers"></div>
                <div class="code-content" id="source-code-content"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Target Panel (Right) -->
        <section class="panel" id="target-panel" aria-label="比较文件面板">
          <header class="panel-header">
            <h2 class="panel-title">
              <svg class="panel-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              比较文件
            </h2>
            <span class="file-name" id="target-file-name">
              <span class="file-name-placeholder">未选择文件</span>
            </span>
          </header>
          <div class="drop-zone" id="target-drop-zone" aria-label="比较文件拖放区域">
            <input type="file" class="file-input-hidden" id="target-file-input" accept=".txt,.js,.jsx,.ts,.tsx,.json,.html,.htm,.css,.scss,.sass,.less,.md,.markdown,.xml,.yaml,.yml,.sql,.sh,.bash,.log,.conf,.ini,.properties">
            <div class="drop-zone-content">
              <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <div class="drop-zone-text">
                <span class="drop-zone-title">拖放文件到此处</span>
                <span class="drop-zone-subtitle">或点击选择文件 · 支持粘贴文本</span>
              </div>
              <button type="button" class="clear-file-btn" id="target-clear-btn">清除文件</button>
            </div>
            <div class="file-preview" id="target-file-preview">
              <div class="editor-container">
                <div class="line-numbers" id="target-line-numbers"></div>
                <div class="code-content" id="target-code-content"></div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Diff Results Panel -->
      <div class="diff-results-panel" id="diff-results-panel">
        <div class="diff-results-header">
          <span class="resize-handle"></span>
          <span class="diff-results-title">差异详情</span>
          <span class="diff-results-stats">
            <span class="stat-item"><span class="stat-dot stat-dot-total"></span><span id="stat-total">0</span> 总计</span>
            <span class="stat-item"><span class="stat-dot stat-dot-added"></span><span id="stat-added">0</span> 新增</span>
            <span class="stat-item"><span class="stat-dot stat-dot-removed"></span><span id="stat-removed">0</span> 删除</span>
            <span class="stat-item"><span class="stat-dot stat-dot-modified"></span><span id="stat-modified">0</span> 修改</span>
          </span>
          <div class="diff-tools-bar">
            <div class="view-mode-toggle">
              <button type="button" class="view-mode-btn active" data-mode="split">Split</button>
              <button type="button" class="view-mode-btn" data-mode="unified">Unified</button>
            </div>
            <label class="switch switch-compact">
              <input type="checkbox" class="switch-input" id="hide-unchanged-toggle">
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">隐藏相同行</span>
            </label>
            <label class="switch switch-compact">
              <input type="checkbox" class="switch-input" id="word-wrap-toggle">
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">自动换行</span>
            </label>
            <button type="button" class="btn-text btn-export" id="export-diff" title="导出差异报告">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              导出
            </button>
          </div>
          <button type="button" class="btn-text" id="close-diff-panel" aria-label="关闭">×</button>
        </div>
        <div class="diff-results-content" id="diff-results-content">
          <div class="diff-results-placeholder">点击"开始比对"查看差异结果</div>
        </div>
      </div>
    </main>

  <!-- Modules -->
  <script src="js/file-handler.js"></script>
  <script src="js/diff-engine.js"></script>
  <script src="js/ui-renderer.js"></script>
  <script src="js/scroll-sync.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
