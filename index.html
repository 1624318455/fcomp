<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FComp - 文件比对工具</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- jsdiff CDN -->
  <script>
    window.jsdiffLoaded = false;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsdiff@5.2.0/dist/jsdiff.min.js"></script>
  <script>
    if (typeof Diff !== 'undefined') window.jsdiffLoaded = true;
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">FComp</h1>
        <span class="logo-subtitle">文件比对工具</span>
      </div>
      <div class="header-right">
        <label class="switch">
          <input type="checkbox" class="switch-input" id="sync-scroll-toggle" checked>
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
          <span class="switch-label">同步滚动</span>
        </label>
        <button type="button" class="btn-secondary btn-clear" id="clear-left" aria-label="清空左侧">清空左侧</button>
        <button type="button" class="btn-secondary btn-clear" id="clear-right" aria-label="清空右侧">清空右侧</button>
        <button type="button" class="btn-secondary btn-clear-all" id="clear-all" aria-label="清空全部">清空全部</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Mobile Warning -->
      <div class="mobile-warning" id="mobile-warning">
        <svg class="mobile-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12" y2="18"></line>
        </svg>
        <h2 class="mobile-warning-title">请使用 PC 端访问</h2>
        <p class="mobile-warning-text">FComp 文件比对工具专为桌面端设计，建议在电脑浏览器中打开以获得最佳体验。</p>
      </div>

      <!-- Panels Container -->
      <div class="panels-container">
        <!-- Source Panel (Left) -->
        <section class="panel" id="source-panel" aria-label="原始文件面板">
          <header class="panel-header">
            <h2 class="panel-title">
              <svg class="panel-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              原始文件
            </h2>
            <span class="file-name" id="source-file-name">
              <span class="file-name-placeholder">未选择文件</span>
            </span>
            <div class="panel-actions">
              <input type="file" class="file-input" id="source-file-input" accept=".txt,.js,.jsx,.ts,.tsx,.json,.html,.htm,.css,.scss,.sass,.less,.md,.markdown,.xml,.yaml,.yml,.sql,.sh,.bash,.log,.conf,.ini,.properties" hidden>
              <button type="button" class="btn-secondary btn-upload" id="source-upload-btn" aria-label="上传文件">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                上传文件
              </button>
            </div>
          </header>
          <div class="editor-container" role="region" aria-label="源文件内容">
            <div class="line-numbers" id="source-line-numbers"></div>
            <div class="code-content" id="source-code-content" contenteditable="true" role="textbox" aria-label="源文件编辑区" spellcheck="false"></div>
          </div>
        </section>

        <!-- Target Panel (Right) -->
        <section class="panel" id="target-panel" aria-label="比较文件面板">
          <header class="panel-header">
            <h2 class="panel-title">
              <svg class="panel-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              比较文件
            </h2>
            <span class="file-name" id="target-file-name">
              <span class="file-name-placeholder">未选择文件</span>
            </span>
            <div class="panel-actions">
              <input type="file" class="file-input" id="target-file-input" accept=".txt,.js,.jsx,.ts,.tsx,.json,.html,.htm,.css,.scss,.sass,.less,.md,.markdown,.xml,.yaml,.yml,.sql,.sh,.bash,.log,.conf,.ini,.properties" hidden>
              <button type="button" class="btn-secondary btn-upload" id="target-upload-btn" aria-label="上传文件">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                上传文件
              </button>
            </div>
          </header>
          <div class="editor-container" role="region" aria-label="目标文件内容">
            <div class="line-numbers" id="target-line-numbers"></div>
            <div class="code-content" id="target-code-content" contenteditable="true" role="textbox" aria-label="目标文件编辑区" spellcheck="false"></div>
          </div>
        </section>
      </div>

      <!-- Compare Button -->
      <div class="compare-action">
        <button type="button" class="btn-primary btn-compare" id="compare-btn" aria-label="开始比对">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          开始比对
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="stats-bar" role="status" aria-live="polite">
      <span class="stat-item">
        <span class="stat-dot stat-dot-total"></span>
        <span class="stat-value" id="stat-total">0</span> 处差异
      </span>
      <span class="stat-item">
        <span class="stat-dot stat-dot-added"></span>
        <span class="stat-value" id="stat-added">0</span> 新增
      </span>
      <span class="stat-item">
        <span class="stat-dot stat-dot-removed"></span>
        <span class="stat-value" id="stat-removed">0</span> 删除
      </span>
      <span class="stat-item">
        <span class="stat-dot stat-dot-modified"></span>
        <span class="stat-value" id="stat-modified">0</span> 修改
      </span>
    </footer>
  </div>

  <!-- Modules -->
  <script src="js/file-handler.js"></script>
  <script src="js/diff-engine.js"></script>
  <script src="js/ui-renderer.js"></script>
  <script src="js/scroll-sync.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
