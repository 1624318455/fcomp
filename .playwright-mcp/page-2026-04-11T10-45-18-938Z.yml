          - generic [ref=e63]: "/** * FComp 文件比对工具 - 样式文件 * 严格遵循 UI 设计规范 v1.0 * 使用现代极简主义风格 */ /* ======================================== CSS 变量定义 (Design System) ======================================== */ :root { /* 主色 Primary */ --color-primary: #2563eb; --color-primary-hover: #1d4ed8; --color-primary-active: #1e40af; --color-primary-light: #93c5fd; --color-primary-lighter: #dbeafe; /* 差异高亮色 Diff Colors */ --color-added-bg: #e6ffed; --color-added-border: #22c55e; --color-added-text: #166534; --color-added-word: #bbf7d0; --color-removed-bg: #ffebe9; --color-removed-border: #ef4444; --color-removed-text: #991b1b; --color-removed-word: #fecaca; --color-modified-bg: #fff5b1; --color-modified-border: #f59e0b; --color-modified-text: #92400e; --color-modified-word: #fde047; /* 中性色 Neutral */ --color-bg-page: #f9fafb; --color-bg-card: #ffffff; --color-bg-header: #ffffff; --color-bg-footer: #ffffff; --color-bg-title: #f3f4f6; --color-border: #e5e7eb; --color-border-hover: #d1d5db; /* 文字色 Text */ --color-text-primary: #1f2937; --color-text-body: #374151; --color-text-secondary: #6b7280; --color-text-placeholder: #9ca3af; --color-text-disabled: #d1d5db; /* 功能色 Functional */ --color-success: #22c55e; --color-warning: #f59e0b; --color-error: #ef4444; --color-info: #3b82f6; /* 间距 Spacing */ --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; /* 布局 Layout */ --header-height: 64px; --footer-height: 48px; --panel-gap: 16px; --page-padding: 24px; --panel-min-height: 400px; /* 圆角 Radius */ --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; /* 阴影 Shadow */ --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05); --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.04); --shadow-lg: 0 4px 6px rgba(0, 0, 0, 0.1); /* 过渡 Transition */ --transition-fast: 0.15s ease; --transition-normal: 0.2s ease; --transition-slow: 0.3s ease; /* 字体 Font */ --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace; } /* ======================================== 基础重置 ======================================== */ *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } html { min-width: 1024px; } body { min-width: 1024px; font-family: var(--font-sans); font-size: 14px; line-height: 1.6; color: var(--color-text-body); background-color: var(--color-bg-page); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: auto; } /* ======================================== 应用容器 ======================================== */ .app-container { display: flex; flex-direction: column; min-height: 100vh; min-width: 1024px; } /* ======================================== Header 头部 ======================================== */ .header { display: flex; align-items: center; justify-content: space-between; height: var(--header-height); padding: 0 var(--page-padding); background-color: var(--color-bg-header); border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 100; } .header-left { display: flex; align-items: center; gap: var(--space-4); } .logo { font-size: 24px; font-weight: 600; color: var(--color-primary); letter-spacing: -0.5px; } .logo-subtitle { font-size: 14px; color: var(--color-text-secondary); } /* Header 内的比对按钮 */ .header .btn-compare { margin-left: 16px; } .header-right { display: flex; align-items: center; gap: var(--space-4); } /* ======================================== 主内容区域 ======================================== */ .main-content { display: flex; flex-direction: column; flex: 1; padding: var(--page-padding); padding-bottom: 70px; gap: var(--space-4); } .panels-container { display: flex; gap: var(--panel-gap); flex: 1; min-height: var(--panel-min-height); } /* ======================================== 面板容器 Panel ======================================== */ .panel { display: flex; flex-direction: column; flex: 1; background-color: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); transition: border-color var(--transition-normal), box-shadow var(--transition-normal); } .panel:hover { border-color: var(--color-border-hover); } .panel:focus-within { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); } /* ======================================== 面板标题栏 Panel Header ======================================== */ .panel-header { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 var(--space-3); background-color: var(--color-bg-title); border-bottom: 1px solid var(--color-border); flex-shrink: 0; } .panel-title { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; font-weight: 600; color: var(--color-text-body); } .panel-title-icon { width: 16px; height: 16px; color: var(--color-text-secondary); } .file-name { display: flex; align-items: center; gap: var(--space-1); flex: 1; min-width: 0; padding: 0 var(--space-3); font-size: 13px; font-weight: 400; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .file-name-placeholder { color: var(--color-text-placeholder); font-style: italic; } .panel-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; } /* ======================================== 拖放上传区域 Drop Zone ======================================== */ .drop-zone { display: flex; flex: 1; position: relative; overflow: hidden; } .drop-zone-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); background-color: var(--color-bg-card); border: 2px dashed var(--color-border); border-radius: var(--radius-lg); margin: var(--space-4); transition: all var(--transition-normal); cursor: pointer; } .drop-zone-content:hover, .drop-zone.drag-over .drop-zone-content { border-color: var(--color-primary); background-color: var(--color-primary-lighter); } .drop-zone-icon { width: 48px; height: 48px; color: var(--color-text-placeholder); transition: color var(--transition-normal); } .drop-zone.drag-over .drop-zone-icon { color: var(--color-primary); } .drop-zone-text { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); } .drop-zone-title { font-size: 16px; font-weight: 600; color: var(--color-text-body); } .drop-zone-subtitle { font-size: 13px; color: var(--color-text-secondary); } .file-input-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 100; } /* 文件预览区域 */ .file-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: auto; background-color: var(--color-bg-card); display: none; } .file-preview-content { padding: var(--space-3); font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--color-text-primary); white-space: pre-wrap; word-break: break-word; min-height: 100%; } /* 清空按钮 */ .drop-zone .clear-file-btn { position: absolute; top: var(--space-2); right: var(--space-2); z-index: 20; display: none; padding: var(--space-1) var(--space-2); font-size: 12px; background-color: rgba(0, 0, 0, 0.5); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; } .drop-zone.has-file .clear-file-btn { display: block; } .drop-zone.has-file .drop-zone-content { display: none; } .drop-zone.has-file .file-preview { display: block; } /* 拖放时的视觉反馈 */ .drop-zone.drag-over::after { content: ''; position: absolute; inset: var(--space-4); border: 2px solid var(--color-primary); border-radius: var(--radius-lg); background-color: rgba(37, 99, 235, 0.1); pointer-events: none; z-index: 5; } /* ======================================== 差异行样式 Diff Lines ======================================== */ .diff-line { display: flex; min-height: calc(13px * 1.7); padding-left: var(--space-3); font-family: var(--font-mono); font-size: 13px; line-height: 1.7; } /* 新增行 */ .diff-line-added { background-color: var(--color-added-bg); border-left: 3px solid var(--color-added-border); } .diff-line-added .line-content { color: var(--color-added-text); } /* 删除行 */ .diff-line-removed { background-color: var(--color-removed-bg); border-left: 3px solid var(--color-removed-border); } .diff-line-removed .line-content { color: var(--color-removed-text); } /* 修改行 */ .diff-line-modified { background-color: var(--color-modified-bg); border-left: 3px solid var(--color-modified-border); } .diff-line-modified .line-content { color: var(--color-modified-text); } /* 相同行 */ .diff-line-unchanged { background-color: transparent; border-left: 3px solid transparent; } .line-content { flex: 1; word-break: break-all; } /* 词级高亮 */ .word-added { background-color: var(--color-added-word); border-radius: 2px; padding: 0 2px; color: var(--color-added-text); } .word-removed { background-color: var(--color-removed-word); border-radius: 2px; padding: 0 2px; color: var(--color-removed-text); text-decoration: line-through; } .word-modified { background-color: var(--color-modified-word); border-radius: 2px; padding: 0 2px; color: var(--color-modified-text); } /* ======================================== 按钮组件 Buttons ======================================== */ /* 主按钮 Primary Button */ .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 36px; padding: 0 20px; font-size: 14px; font-weight: 500; color: #ffffff; background-color: var(--color-primary); border: none; border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-normal); } .btn-primary:hover { background-color: var(--color-primary-hover); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3); transform: translateY(-1px); } .btn-primary:active { background-color: var(--color-primary-active); box-shadow: none; transform: translateY(0); } .btn-primary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; } .btn-primary:disabled { background-color: var(--color-primary-light); color: #ffffff; cursor: not-allowed; box-shadow: none; transform: none; } .btn-primary.loading { cursor: wait; opacity: 0.8; } /* 次按钮 Secondary Button */ .btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); height: 36px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--color-primary); background-color: #ffffff; border: 1px solid var(--color-primary); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-normal); } .btn-secondary:hover { background-color: var(--color-primary-lighter); border-color: var(--color-primary-hover); color: var(--color-primary-hover); } .btn-secondary:active { background-color: var(--color-primary-lighter); } .btn-secondary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; } .btn-secondary:disabled { color: var(--color-text-placeholder); border-color: var(--color-border-hover); background-color: var(--color-bg-page); cursor: not-allowed; } /* 文字按钮 Text Button */ .btn-text { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); font-size: 14px; font-weight: 500; color: var(--color-primary); background: transparent; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); } .btn-text:hover { background-color: var(--color-primary-lighter); } .btn-text:active { background-color: var(--color-primary-lighter); } /* 清空按钮 */ .btn-clear, .btn-clear-all, .btn-upload { height: 32px; padding: 0 12px; font-size: 13px; } /* 比对按钮 */ .btn-compare { height: 44px; padding: 0 32px; font-size: 16px; } /* 图标 */ .btn-icon { width: 16px; height: 16px; flex-shrink: 0; } /* ======================================== 开关组件 Switch ===============================