          - generic [ref=e59]: "/** * FComp 主入口文件 * 负责初始化应用、绑定事件、全局状态管理 * 严格遵循架构方案设计规范 */ (function() { 'use strict'; // ======================================== // Toast 通知工具函数 // ======================================== function showToast(message, type) { type = type || 'info'; var container = document.getElementById('toast-container'); if (!container) return; var toast = document.createElement('div'); toast.className = 'toast toast-' + type; toast.textContent = message; container.appendChild(toast); setTimeout(function() { toast.style.animation = 'toastFadeOut 0.3s ease-out'; setTimeout(function() { if (toast.parentNode) { toast.parentNode.removeChild(toast); } }, 300); }, 3000); } // ======================================== // 全局状态 // ======================================== var state = { sourceContent: '', targetContent: '', sourceFileName: '', targetFileName: '', diffResult: null, syncScrollEnabled: true, isComparing: false }; // ======================================== // DOM 元素引用 // ======================================== var elements = { sourceDropZone: null, targetDropZone: null, sourceFileInput: null, targetFileInput: null, sourceFilePreview: null, targetFilePreview: null, sourceCodeContent: null, targetCodeContent: null, sourceFileName: null, targetFileName: null, compareBtn: null, clearLeftBtn: null, clearRightBtn: null, clearAllBtn: null, syncScrollToggle: null }; // ======================================== // 初始化 // ======================================== function init() { cacheElements(); bindEvents(); checkJsDiffLoaded(); console.log('FComp 初始化完成'); } /** * 缓存 DOM 元素引用 */ function cacheElements() { elements.sourceDropZone = document.getElementById('source-drop-zone'); elements.targetDropZone = document.getElementById('target-drop-zone'); elements.sourceFileInput = document.getElementById('source-file-input'); elements.targetFileInput = document.getElementById('target-file-input'); elements.sourceFilePreview = document.getElementById('source-file-preview'); elements.targetFilePreview = document.getElementById('target-file-preview'); elements.sourceCodeContent = document.getElementById('source-code-content'); elements.targetCodeContent = document.getElementById('target-code-content'); elements.sourceFileName = document.getElementById('source-file-name'); elements.targetFileName = document.getElementById('target-file-name'); elements.compareBtn = document.getElementById('compare-btn'); elements.clearLeftBtn = document.getElementById('clear-left'); elements.clearRightBtn = document.getElementById('clear-right'); elements.clearAllBtn = document.getElementById('clear-all'); elements.syncScrollToggle = document.getElementById('sync-scroll-toggle'); } /** * 检查 jsdiff 是否加载成功 */ function checkJsDiffLoaded() { if (typeof Diff === 'undefined') { showToast('错误：jsdiff 库加载失败，请检查网络连接后刷新页面重试。', 'error'); elements.compareBtn.disabled = true; return false; } return true; } // ======================================== // 事件绑定 // ======================================== function bindEvents() { // 左侧拖放区域 setupDropZone(elements.sourceDropZone, elements.sourceFileInput, 'source'); // 右侧拖放区域 setupDropZone(elements.targetDropZone, elements.targetFileInput, 'target'); // 开始比对按钮 elements.compareBtn.addEventListener('click', handleCompare); // 清空按钮 elements.clearLeftBtn.addEventListener('click', handleClearLeft); elements.clearRightBtn.addEventListener('click', handleClearRight); elements.clearAllBtn.addEventListener('click', handleClearAll); // 同步滚动开关 elements.syncScrollToggle.addEventListener('change', function(e) { state.syncScrollEnabled = e.target.checked; }); // 键盘快捷键 document.addEventListener('keydown', handleKeyDown); } /** * 设置拖放区域事件 */ function setupDropZone(dropZone, fileInput, side) { if (!dropZone || !fileInput) return; // 文件选择变化 fileInput.addEventListener('change', function(e) { if (e.target.files && e.target.files.length > 0) { handleFile(e.target.files[0], side); } }); // 有文件时禁止点击触发上传 dropZone.addEventListener('click', function(e) { if (dropZone.classList.contains('has-file')) { e.preventDefault(); e.stopPropagation(); } }); // 清除按钮点击 var clearBtn = document.getElementById(side === 'source' ? 'source-clear-btn' : 'target-clear-btn'); if (clearBtn) { clearBtn.addEventListener('click', function(e) { e.stopPropagation(); clearPanel(side); }); } // 拖拽进入 dropZone.addEventListener('dragenter', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag-over'); }); // 拖拽悬停 dropZone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag-over'); }); // 拖拽离开 dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('drag-over'); }); // 放下文件 dropZone.addEventListener('drop', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('drag-over'); var files = e.dataTransfer.files; if (files && files.length > 0) { handleFile(files[0], side); } }); } /** * 处理文件 */ function handleFile(file, side) { var reader = new FileReader(); var fileInput = side === 'source' ? elements.sourceFileInput : elements.targetFileInput; reader.onload = function(e) { var content = e.target.result; if (side === 'source') { state.sourceContent = content; state.sourceFileName = file.name; elements.sourceFileName.innerHTML = '<span>' + escapeHtml(file.name) + '</span>'; elements.sourceCodeContent.textContent = content; elements.sourceDropZone.classList.add('has-file'); } else { state.targetContent = content; state.targetFileName = file.name; elements.targetFileName.innerHTML = '<span>' + escapeHtml(file.name) + '</span>'; elements.targetCodeContent.textContent = content; elements.targetDropZone.classList.add('has-file'); } // 隐藏差异面板 var diffPanel = document.getElementById('diff-results-panel'); if (diffPanel) { diffPanel.classList.remove('active'); } state.diffResult = null; // 清空 file input 以便再次选择同一文件 fileInput.value = ''; showToast('文件 \"' + file.name + '\" 已加载', 'success'); }; reader.onerror = function() { showToast('文件读取失败', 'error'); // 清空 file input fileInput.value = ''; }; reader.readAsText(file); } /** * 清空指定面板 */ function clearPanel(side) { if (side === 'source') { state.sourceContent = ''; state.sourceFileName = ''; elements.sourceFileName.innerHTML = '<span class=\"file-name-placeholder\">未选择文件</span>'; elements.sourceCodeContent.textContent = ''; elements.sourceDropZone.classList.remove('has-file'); } else { state.targetContent = ''; state.targetFileName = ''; elements.targetFileName.innerHTML = '<span class=\"file-name-placeholder\">未选择文件</span>'; elements.targetCodeContent.textContent = ''; elements.targetDropZone.classList.remove('has-file'); } // 隐藏差异面板 var diffPanel = document.getElementById('diff-results-panel'); if (diffPanel) { diffPanel.classList.remove('active'); } state.diffResult = null; // 重置统计 document.getElementById('stat-total').textContent = '0'; document.getElementById('stat-added').textContent = '0'; document.getElementById('stat-removed').textContent = '0'; document.getElementById('stat-modified').textContent = '0'; } /** * 清空左侧 */ function handleClearLeft() { clearPanel('source'); } /** * 清空右侧 */ function handleClearRight() { clearPanel('target'); } /** * 清空所有 */ function handleClearAll() { clearPanel('source'); clearPanel('target'); showToast('已清空所有内容', 'info'); } /** * 处理比对 */ function handleCompare() { if (!state.sourceContent && !state.targetContent) { showToast('请先上传两个文件', 'warning'); return; } if (!checkJsDiffLoaded()) { return; } state.isComparing = true; elements.compareBtn.disabled = true; setTimeout(function() { try { var diffResult = DiffEngine.compare(state.sourceContent, state.targetContent); state.diffResult = diffResult; renderDiffResultsPanel(diffResult); var diffPanel = document.getElementById('diff-results-panel'); if (diffPanel) { diffPanel.classList.add('active'); } showToast('比对完成，发现 ' + diffResult.stats.total + ' 处差异', 'info'); } catch (error) { showToast('比对失败：' + error.message, 'error'); console.error(error); } finally { state.isComparing = false; elements.compareBtn.disabled = false; } }, 50); } /** * 渲染差异结果 */ function renderDiffResultsPanel(diffResult) { var contentEl = document.getElementById('diff-results-content'); if (!contentEl) return; var stats = diffResult.stats || { added: 0, removed: 0, modified: 0, total: 0 }; document.getElementById('stat-total').textContent = stats.total; document.getElementById('stat-added').textContent = stats.added; document.getElementById('stat-removed').textContent = stats.removed; document.getElementById('stat-modified').textContent = stats.modified; contentEl.innerHTML = ''; var sourceLines = diffResult.source || []; var targetLines = diffResult.target || []; var items = []; sourceLines.forEach(function(line, index) { if (line.type === 'removed' || line.type === 'modified') { items.push({ side: 'source', lineNum: index + 1, type: line.type, content: line.content || '(空行)' }); } }); targetLines.forEach(function(line, index) { if (line.type === 'added' || line.type === 'modified') { items.push({ side: 'target', lineNum: index + 1, type: line.type, content: line.content || '(空行)' }); } }); if (items.length === 0) { contentEl.innerHTML = '<div class=\"diff-results-placeholder\">两份内容完全相同，无差异</div>'; return; } items.forEach(function(item) { var el = document.createElement('div'); el.className = 'diff-result-item ' + item.type; var typeLabel = item.type === 'added' ? '新增' : (item.type === 'removed' ? '删除' : '修改'); var sideLabel = item.side === 'source' ? '左侧' : '右侧'; el.innerHTML = '<span class=\"diff-result-line\">' + sideLabel + ' 第' + item.lineNum + '行</span>' + '<span class=\"diff-result-content\">' + escapeHtml(item.content) + '</span>'; contentEl.appendChild(el); }); } /** * HTML 转义 */ function escapeHtml(str) { if (!str) return ''; return str .replace(/&/g, '&amp;') .replace(/</g, '&lt;') .replace(/>/g, '&gt;') .replace(/\"/g, '&quot;') .replace(/'/g, '&#039;'); } /** * 键盘快捷键 */ function handleKeyDown(e) { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); handleCompare(); } } // 初始化应用 init(); })();"
